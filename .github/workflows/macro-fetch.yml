name: macro-fetch (FRED → 월간판정 입력)

on:
  schedule:
    # 매주 금요일 미국 장 마감 후 (22:30 UTC = 토 07:30 KST) — 트리거 주간 점검용
    - cron: "30 22 * * 5"
    # 매월 1일 01:00 UTC (10:00 KST) — 월간 판정 기준일용
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 없어도 동작 (fredgraph.csv 사용)
        run: python scripts/fetch_fred.py "claude/advisor/월간판정/입력"
      - name: Commit results
        run: |
          git config user.name "macro-fetch bot"
          git config user.email "actions@users.noreply.github.com"
          git add "claude/advisor/월간판정/입력"
          git diff --cached --quiet && echo "no change" || git commit -m "macro-fetch: FRED $(date -u +%F)"
          git push
